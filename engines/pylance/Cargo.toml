[package]
name = "pylance-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
arrow-array = "56"
arrow-schema = "56"
futures = "0.3"
lance = { version = "1.0.1", default-features = false }
lance-index = "1.0.1"
once_cell = "1.19"
regex = "1"
serde_json = "1.0"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
